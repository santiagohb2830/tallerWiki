<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Header Fragment</title>
</head>
<body>
    <header class="header" th:fragment="header">
        <div class="header-content">
            <a href="/" class="logo-link">
                <h1 class="logo">
                    <i class="fas fa-users"></i>
                    <span class="logo-text">Wiki del Equipo</span>
                </h1>
            </a>
            
            <nav class="nav">
                <a href="/" class="nav-link" th:classappend="${paginaActual == 'inicio'} ? 'active' : ''">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </a>
                <a href="/#equipo" class="nav-link" th:classappend="${paginaActual == 'equipo'} ? 'active' : ''">
                    <i class="fas fa-users"></i>
                    <span>Equipo</span>
                </a>
                <a href="/contacto" class="nav-link" th:classappend="${paginaActual == 'contacto'} ? 'active' : ''">
                    <i class="fas fa-envelope"></i>
                    <span>Contacto</span>
                </a>
            </nav>
            
            <!-- Menú móvil -->
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir menú">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        
        <!-- Menú móvil desplegable -->
        <div class="mobile-nav" id="mobileNav">
            <a href="/" class="mobile-nav-link" th:classappend="${paginaActual == 'inicio'} ? 'active' : ''">
                <i class="fas fa-home"></i>
                <span>Inicio</span>
            </a>
            <a href="/#equipo" class="mobile-nav-link" th:classappend="${paginaActual == 'equipo'} ? 'active' : ''">
                <i class="fas fa-users"></i>
                <span>Equipo</span>
            </a>
            <a href="/contacto" class="mobile-nav-link" th:classappend="${paginaActual == 'contacto'} ? 'active' : ''">
                <i class="fas fa-envelope"></i>
                <span>Contacto</span>
            </a>
        </div>
    </header>
</body>
</html>
